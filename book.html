<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>全謹地政士事務所 — 預約諮詢</title>
<style>
  /* 朱墨印譜 tokens(styles.css :root 同源) */
  :root{--bg:#ECE6D8;--panel:#F6F1E4;--ink:#181410;--ink2:#5A5142;
        --accent:#C0392B;--rule2:#B6A98A;--seal-text:#F6F1E4;
        --fd:"Noto Serif TC","Songti TC",serif;
        --fb:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);
       display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--panel);border:1.5px solid var(--rule2);max-width:420px;
        width:100%;padding:28px 24px;text-align:center}
  .seal{width:56px;height:56px;background:var(--accent);color:var(--seal-text);
        font-family:var(--fd);font-weight:900;font-size:21px;letter-spacing:2px;
        display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  h1{font-family:var(--fd);font-size:19px;font-weight:900;margin:0 0 6px}
  p{font-size:14.5px;color:var(--ink2);line-height:1.75;margin:8px 0 0}
  .btns{display:none;flex-direction:column;gap:12px;margin-top:20px}
  a.btn{display:block;padding:15px 12px;font-size:16.5px;font-weight:700;
        text-decoration:none;border:1.5px solid var(--accent)}
  a.btn.primary{background:var(--accent);color:var(--seal-text)}
  a.btn.secondary{color:var(--accent)}
  .note{font-size:12px;color:var(--ink2);margin-top:16px}
</style>
</head>
<body>
<div class="card">
  <div class="seal">全謹</div>
  <h1>預約諮詢</h1>
  <p id="msg">正在為您準備預約頁面…</p>
  <div class="btns" id="btns">
    <a class="btn primary" id="btn-phone" href="#">📞 電話洽談（約30分鐘）</a>
    <a class="btn secondary" id="btn-office" href="#">🏢 到所面談（約60分鐘）</a>
  </div>
  <p class="note" id="note"></p>
</div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// LIFF 身分自解(2026-08-27 WS2):點開者本人的 LINE userId 直接帶進 cal 連結的
// metadata[line_uid] — 身分 join 由結構保證(姓名比對 join 已封死)。
var LIFF_ID = "2011298513-aJ8dyNQ0";  // 全謹預約 Login channel(全謹代書 provider),2026-08-28
var CAL_BASE = "https://cal.com/talent3000";
// 實測 2026-08-27:裸 slug(office-visit)為 404,只有帶後綴的可用
var SLUG_PHONE = "phone-consult-ca1eb98e";
var SLUG_OFFICE = "office-visit-ca1eb98e";
var GATE_BASE = "https://bribe-handwoven-bobbed.ngrok-free.dev";

// ?debug=1 → 不轉導,直接顯示解析到的身分。用途:證明這個 LIFF 所屬的
// LINE Login channel 與 Messaging API channel 在同一個 Provider(userId
// 必須與 webhook 端一致;跨 Provider 會拿到不同的 uid,身分 join 全毀)。
function qs(k) {
  try {
    var p = new URLSearchParams(location.search).get(k);
    if (p !== null) return p;
    var st = new URLSearchParams(location.search).get("liff.state");
    if (st) return new URLSearchParams(st.replace(/^\?/, "")).get(k);
  } catch (e) {}
  return null;
}

function calUrl(slug, uid, name) {
  var q = "metadata%5Bline_uid%5D=" + encodeURIComponent(uid);
  if (name) q += "&name=" + encodeURIComponent(name);
  return CAL_BASE + "/" + slug + "?" + q;
}
function show(msg) { document.getElementById("msg").textContent = msg; }

function ready(uid, name) {
  document.getElementById("btn-phone").href = calUrl(SLUG_PHONE, uid, name);
  document.getElementById("btn-office").href = calUrl(SLUG_OFFICE, uid, name);
  show((name ? name + " 您好 🙏 " : "您好 🙏 ") + "請選擇方便的諮詢方式：");
  document.getElementById("btns").style.display = "flex";
  document.getElementById("note").textContent =
    "選擇時段送出後，全謹代書團隊確認會透過 LINE 通知您。";
}

function main() {
  if (!window.liff) { show("載入失敗，請稍後再試 🙏"); return; }
  liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isInClient() && !liff.isLoggedIn()) {
      // 外部瀏覽器且未登入:不無身分放行(身分 join 不可破)
      show("請由 LINE 對話中的連結開啟本頁 🙏");
      return;
    }
    liff.getProfile().then(function (prof) {
      var uid = prof.userId || "";
      var name = prof.displayName || "";
      if (qs("debug") === "1") {
        show("驗證模式");
        document.getElementById("note").textContent =
          "userId = " + uid + "｜displayName = " + name;
        return;
      }
      if (!uid) { show("請由 LINE 對話中的連結開啟本頁 🙏"); return; }
      // 預約閘:已有在途預約 → 引導回 LINE;網路錯 fail-open 放行
      fetch(GATE_BASE + "/booking-gate/" + uid,
            { headers: { "ngrok-skip-browser-warning": "1" } })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && d.allow === false) {
            show("您已有一筆預約待處理 🙏 如需調整時間，請直接在 LINE 對話中告知我們，全謹代書團隊會協助您。");
          } else { ready(uid, name); }
        })
        .catch(function () { ready(uid, name); });
    }).catch(function () { show("請由 LINE 對話中的連結開啟本頁 🙏"); });
  }).catch(function () {
    show("請由 LINE 對話中的連結開啟本頁 🙏");
  });
}
main();
</script>
</body>
</html>
