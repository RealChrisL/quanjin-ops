<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全謹地政士事務所｜線上預約諮詢</title>
<style>
  :root{ --bg:#ECE6D8; --panel:#F6F1E4; --ink:#181410; --ink2:#5A5142;
         --accent:#C0392B; --rule2:#B6A98A; --seal-text:#F6F1E4;
         --fd:"Noto Serif TC","Songti TC",serif; --fb:"Noto Sans TC","PingFang TC",sans-serif; }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);}
  header{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:2px solid var(--ink);background:var(--bg);}
  .seal{width:44px;height:44px;flex:0 0 44px;background:var(--accent);color:var(--seal-text);
        font-family:var(--fd);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:15px;letter-spacing:1px;}
  h1{font-family:var(--fd);font-weight:900;font-size:18px;margin:0;line-height:1.3;}
  .sub{font-size:12px;color:var(--ink2);margin-top:2px;}
  .tabs{display:flex;gap:8px;padding:12px 16px 0;}
  .tab{flex:1;padding:10px 8px;font-size:14px;font-weight:700;text-align:center;border:1.5px solid var(--rule2);
       background:var(--panel);color:var(--ink);cursor:pointer;}
  .tab.active{background:var(--accent);color:var(--seal-text);border-color:var(--accent);}
  #frame-wrap{padding:12px 8px 4px;}
  iframe{width:100%;min-height:72vh;border:1.5px solid var(--rule2);background:#fff;}
  .fallback{padding:10px 16px 4px;font-size:13px;color:var(--ink2);line-height:1.7;}
  .fallback a{color:var(--accent);}
  footer{padding:8px 16px 24px;font-size:11.5px;color:#8C8169;line-height:1.7;}
</style>
</head>
<body>
<header>
  <div class="seal">全謹</div>
  <div>
    <h1>線上預約諮詢</h1>
    <p class="sub">請選擇您方便的時段，我們會盡快確認並回覆您</p>
  </div>
</header>
<div class="tabs">
  <button class="tab active" id="tab-office" type="button">🏢 到所面談</button>
  <button class="tab" id="tab-phone" type="button">📞 電話洽談</button>
</div>
<div id="frame-wrap"><iframe id="cal-frame" title="預約時段" loading="eager"></iframe></div>
<p class="fallback">頁面若未正常載入，請<a id="direct-link" href="https://cal.com/talent3000/office-visit" target="_blank" rel="noopener">點此開啟預約頁</a>，或直接在 LINE 對話中留言告訴我們方便的時間，我們會盡快協助安排 🙏</p>
<footer>您在此頁留下的姓名與聯絡方式，僅用於這次的預約確認及聯繫。</footer>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  // LIFF ID 由 Chris 於 LINE Developers 建立後填入(空值=一般瀏覽器模式,照常可用)
  var LIFF_ID = "";
  var BASE = "https://cal.com/talent3000/";
  var profile = null;
  function calUrl(slug){
    var u = BASE + slug + "?embed=true";
    if (profile){
      u += "&name=" + encodeURIComponent(profile.displayName || "");
      u += "&metadata[line_uid]=" + encodeURIComponent(profile.userId || "");
    }
    return u;
  }
  function show(slug){
    document.getElementById("cal-frame").src = calUrl(slug);
    document.getElementById("direct-link").href = BASE + slug;
    document.getElementById("tab-office").classList.toggle("active", slug==="office-visit");
    document.getElementById("tab-phone").classList.toggle("active", slug==="phone-consult");
  }
  document.getElementById("tab-office").onclick = function(){ show("office-visit"); };
  document.getElementById("tab-phone").onclick = function(){ show("phone-consult"); };
  function boot(){
    if (LIFF_ID && window.liff){
      liff.init({ liffId: LIFF_ID }).then(function(){
        if (liff.isLoggedIn && liff.isLoggedIn()){
          return liff.getProfile().then(function(p){ profile = p; });
        }
      }).catch(function(){}).finally(function(){ show("office-visit"); });
    } else {
      show("office-visit");
    }
  }
  boot();
</script>
</body>
</html>
